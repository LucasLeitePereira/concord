<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Concord — tela de Pedro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 960px; height: 600px; overflow: hidden; background: #0B0C0E; color: #EDEEF0; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px">

<sc-if value="{{showVideo}}" hint-placeholder-val="{{ true }}">
<svg role="img" aria-label="Transmissão da tela de Pedro" width="960" height="540" viewBox="0 0 960 540" style="position: absolute; left: 0; top: 30px; display: block">
<rect x="0" y="0" width="960" height="540" fill="#1B2836"></rect>
<polygon points="0,300 140,210 260,270 400,180 560,260 700,200 840,250 960,215 960,540 0,540" fill="#22344A"></polygon>
<rect x="0" y="352" width="960" height="188" fill="#1E2D26"></rect>
<polygon points="430,352 530,352 700,540 260,540" fill="#2A3438"></polygon>
<rect x="96" y="268" width="70" height="84" fill="#263546"></rect>
<rect x="176" y="236" width="48" height="116" fill="#263546"></rect>
<rect x="742" y="250" width="86" height="102" fill="#263546"></rect>
<rect x="838" y="282" width="44" height="70" fill="#263546"></rect>
<circle cx="760" cy="96" r="30" fill="#2C3E52"></circle>
<rect x="24" y="486" width="180" height="10" rx="5" fill="#2A3A4A"></rect>
<rect x="24" y="486" width="128" height="10" rx="5" fill="#4F7A66"></rect>
<rect x="836" y="20" width="104" height="104" rx="8" fill="none" stroke="#3B4B5C" stroke-width="2"></rect>
<circle cx="888" cy="72" r="4" fill="#9CCBF0"></circle>
</svg>
</sc-if>

<sc-if value="{{showStats}}" hint-placeholder-val="{{ true }}">
<div role="region" aria-label="Estatísticas da transmissão" style="position: absolute; left: 16px; top: 46px; box-sizing: border-box; min-width: 220px; padding: 10px 12px; border-radius: 10px; background: #0F1012; border: 1px solid #2A2E33; display: grid; grid-template-columns: repeat(2, minmax(0, auto)); column-gap: 18px; row-gap: 4px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px">
<span style="color: #A0A6AD">fps</span><span style="text-align: right">60</span>
<span style="color: #A0A6AD">bitrate</span><span style="text-align: right">7,8 Mbps</span>
<span style="color: #A0A6AD">perda</span><span style="text-align: right">0,2%</span>
<span style="color: #A0A6AD">latência</span><span style="text-align: right">42 ms</span>
<span style="color: #A0A6AD">resolução</span><span style="text-align: right">1920 × 1080</span>
</div>
</sc-if>

<sc-if value="{{showBar}}" hint-placeholder-val="{{ true }}">
<div role="toolbar" aria-label="Controles da transmissão" style="position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 14px; background: #17191C; border: 1px solid #2A2E33; white-space: nowrap">
<div style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px 0 6px">
<span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 50%; background: #1E3B33; color: #8FE8BB; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">P</span>
<span style="display: flex; flex-direction: column">
<span style="font-size: 13px; font-weight: 600">Pedro</span>
<span style="font-size: 12px; color: #A0A6AD; font-family: 'JetBrains Mono', ui-monospace, monospace">1080p · 60</span>
</span>
</div>
<span aria-hidden="true" style="width: 1px; height: 28px; background: #2A2E33"></span>
<label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; color: #A0A6AD">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
<input type="range" min="0" max="100" defaultValue="80" aria-label="Volume da transmissão" style="width: 110px; accent-color: {{accent}}">
</label>
<span aria-hidden="true" style="width: 1px; height: 28px; background: #2A2E33"></span>
<button type="button" aria-keyshortcuts="F11" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border-radius: 10px; border: none; background: transparent; color: #EDEEF0; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
Tela cheia
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; padding: 2px 6px; border-radius: 6px; background: #2A2E33; color: #C9CDD2">F11</span>
</button>
<button type="button" aria-keyshortcuts="F3" aria-pressed="{{statsPressed}}" onClick="{{toggleStats}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border-radius: 10px; border: none; background: {{statsBg}}; color: #EDEEF0; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"></path></svg>
Estatísticas
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; padding: 2px 6px; border-radius: 6px; background: #2A2E33; color: #C9CDD2">F3</span>
</button>
<span aria-hidden="true" style="width: 1px; height: 28px; background: #2A2E33"></span>
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 10px; background: #1F2226; color: #EDEEF0; font-size: 13px; font-weight: 600; text-decoration: none">Parar de assistir</a>
</div>
</sc-if>

<sc-if value="{{showConectando}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 0; top: 30px; width: 960px; height: 540px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 50%; background: #1F2226; color: #A0A6AD; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
</div>
<span style="font-size: 16px; font-weight: 700">Conectando à transmissão…</span>
<span style="font-size: 13px; color: #A0A6AD">Pedro · <span style="font-family: 'JetBrains Mono', ui-monospace, monospace">1080p · 60 fps</span></span>
</div>
</sc-if>

<sc-if value="{{showEncerrada}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 30px; width: 960px; height: 540px; display: flex; align-items: center; justify-content: center">
<div role="status" style="width: 340px; box-sizing: border-box; padding: 24px; border-radius: 16px; background: #17191C; border: 1px solid #2A2E33; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="font-size: 16px; font-weight: 700">Transmissão encerrada</span>
<span style="font-size: 13px; color: #A0A6AD">Pedro parou de transmitir.</span>
<a href="Main.dc.html" style="margin-top: 6px; display: flex; align-items: center; min-height: 44px; padding: 0 22px; box-sizing: border-box; border-radius: 12px; background: #1F2226; color: #EDEEF0; font-weight: 600; text-decoration: none">Fechar</a>
</div>
</div>
</sc-if>

<sc-if value="{{showInstavel}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; top: 46px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #17191C; border: 1px solid #2A2E33; font-size: 13px; white-space: nowrap">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#EDEEF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
<span style="font-weight: 600">Conexão instável</span>
<span style="color: #A0A6AD">· a imagem pode travar ou perder qualidade</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["assistindo","conectando","encerrada","instavel"],"default":"assistindo"},"accent":{"editor":"color","default":"#3DD68C","options":["#3DD68C","#4CC9F0","#B79CFF"]},"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stats: true };
  }
  renderVals() {
    const accent = this.props.accent ?? '#3DD68C';
    const estado = this.props.estado ?? 'assistindo';
    const playing = estado === 'assistindo' || estado === 'instavel';
    return {
      accent,
      showVideo: playing,
      showBar: estado === 'assistindo',
      showStats: estado === 'assistindo' && this.state.stats,
      showConectando: estado === 'conectando',
      showEncerrada: estado === 'encerrada',
      showInstavel: estado === 'instavel',
      statsPressed: String(this.state.stats),
      statsBg: this.state.stats ? '#23262A' : 'transparent',
      toggleStats: () => this.setState({ stats: !this.state.stats })
    };
  }
}
</script>
</body>
</html>
