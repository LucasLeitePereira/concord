<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Concord — mesa de sons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #3DD68C;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 820px; width: 100%; box-sizing: border-box; background: #0F1012; color: #EDEEF0; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; display: flex; flex-wrap: wrap">

<div style="flex: 1 1 280px; max-width: 100%; display: flex; flex-direction: column; background: #141619; border-right: 1px solid #23262A">
<dc-import name="Lateral" ativo="sons" presenca="chamada" accent="{{accent}}" hint-size="100%,800px"></dc-import>
</div>

<main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Mesa de sons</h1>
<p style="margin: 0; font-size: 14px; color: #A0A6AD">Os atalhos funcionam até com o jogo aberto.</p>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: {{accent}}; color: #06281A; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Adicionar som
</button>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding: 6px 16px; border-radius: 14px; background: #17191C; border: 1px solid #23262A">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px; flex: 1 1 280px">
<label for="sons-vol" style="font-size: 13px; color: #A0A6AD; white-space: nowrap">Volume geral</label>
<input id="sons-vol" type="range" min="0" max="100" value="{{master}}" onChange="{{onMaster}}" style="flex-grow: 1; min-width: 0; margin: 0; accent-color: {{accent}}">
<span style="width: 44px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px">{{masterText}}</span>
</div>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; flex: 1 1 260px; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Ouvir no meu fone também</span><span style="font-size: 12px; color: #A0A6AD">Os amigos ouvem de qualquer jeito.</span></span>
<input type="checkbox" defaultChecked="{{ true }}" style="width: 20px; height: 20px; flex-shrink: 0; margin: 0; accent-color: {{accent}}; cursor: pointer">
</label>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px">
<sc-for list="{{sounds}}" as="s" hint-placeholder-count="7">
<div style="border-radius: 16px; background: {{s.bg}}; border: 1px solid {{s.border}}; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 150px; box-sizing: border-box">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<span style="font-weight: 700; font-size: 15px">{{s.name}}</span>
<span style="font-size: 12px; color: #A0A6AD; font-family: 'JetBrains Mono', ui-monospace, monospace">{{s.duration}}</span>
</div>
<span style="align-self: flex-start; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #23262A; color: #C9CDD2">{{s.hotkey}}</span>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="{{s.playLabel}}" onClick="{{s.toggle}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: {{s.btnBg}}; color: {{s.btnColor}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{s.isPlaying}}" hint-placeholder-val="{{ false }}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
</sc-if>
<sc-if value="{{s.isIdle}}" hint-placeholder-val="{{ true }}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
</sc-if>
</button>
<input type="range" min="0" max="100" defaultValue="{{s.volume}}" aria-label="{{s.volLabel}}" style="flex-grow: 1; min-width: 0; margin: 0; accent-color: {{accent}}">
</div>
</div>
</sc-for>
<button type="button" style="border-radius: 16px; border: 2px dashed #2A2E33; background: transparent; color: #A0A6AD; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px; padding: 14px; text-align: center; font-family: inherit; font-size: 14px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
<span style="font-weight: 600; color: #EDEEF0">Solte um arquivo aqui</span>
<span style="font-size: 12px">ou clique para escolher · MP3, OGG, WAV ou FLAC</span>
</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DD68C","options":["#3DD68C","#4CC9F0","#B79CFF"]},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: 'risada', master: 70 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#3DD68C';
    const list = [
      { id: 'buzina', name: 'Buzina', duration: '0:02', hotkey: 'Ctrl+Num1', volume: 80 },
      { id: 'risada', name: 'Risada', duration: '0:03', hotkey: 'Ctrl+Num2', volume: 70 },
      { id: 'trombone', name: 'Trombone triste', duration: '0:04', hotkey: 'Ctrl+Num3', volume: 75 },
      { id: 'aplausos', name: 'Aplausos', duration: '0:05', hotkey: 'Ctrl+Num4', volume: 60 },
      { id: 'ding', name: 'Ding', duration: '0:01', hotkey: 'Ctrl+Num5', volume: 90 },
      { id: 'suspense', name: 'Suspense', duration: '0:06', hotkey: 'Ctrl+Num6', volume: 65 },
      { id: 'vitoria', name: 'Vitória', duration: '0:04', hotkey: 'Ctrl+Num7', volume: 70 }
    ];
    return {
      accent,
      master: this.state.master,
      masterText: this.state.master + '%',
      onMaster: (e) => this.setState({ master: Number(e.target.value) }),
      sounds: list.map((s) => {
        const on = this.state.playing === s.id;
        return Object.assign({}, s, {
          isPlaying: on,
          isIdle: !on,
          playLabel: (on ? 'Parar ' : 'Tocar ') + s.name,
          volLabel: 'Volume de ' + s.name,
          bg: on ? '#16241E' : '#17191C',
          border: on ? accent : '#23262A',
          btnBg: on ? accent : '#23262A',
          btnColor: on ? '#06281A' : '#EDEEF0',
          toggle: () => this.setState({ playing: on ? null : s.id })
        });
      })
    };
  }
}
</script>
</body>
</html>
