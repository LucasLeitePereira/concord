<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sala — compartilhar tela</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0F1012}
a{color:#EDEEF0;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #3DD68C;outline-offset:2px}
</style>
</helmet>
<div role="dialog" aria-labelledby="share-title" style="width: 760px; height: 680px; box-sizing: border-box; background: #17191C; color: #EDEEF0; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; border-radius: 20px; border: 1px solid #2A2E33; padding: 28px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 id="share-title" style="margin: 0; font-size: 20px; font-weight: 700">Compartilhar tela</h1>
<span style="font-size: 13px; color: #A0A6AD">Pedro vai ver o que você escolher abaixo.</span>
</div>
<a href="Main.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 12px; background: #1F2226; color: #A0A6AD; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div role="tablist" aria-label="Tipo de fonte" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #0F1012; align-self: flex-start">
<button type="button" role="tab" aria-selected="true" style="min-height: 36px; padding: 0 16px; border-radius: 9px; border: none; background: #2A2E33; color: #EDEEF0; font-weight: 600">Telas</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 36px; padding: 0 16px; border-radius: 9px; border: none; background: transparent; color: #A0A6AD; font-weight: 600">Janelas</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<button type="button" aria-pressed="true" style="padding: 10px; border-radius: 14px; border: 2px solid {{accent}}; background: #1A2420; color: #EDEEF0; display: flex; flex-direction: column; gap: 10px; text-align: left">
<div aria-hidden="true" style="height: 110px; border-radius: 8px; background: #0B0C0E; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; width: 100%">
<div style="height: 8px; width: 40%; border-radius: 4px; background: #2A2E33"></div>
<div style="flex-grow: 1; border-radius: 6px; background: #1E3B33"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700">Tela 1</span>
<span style="font-size: 12px; color: #A0A6AD">2560 × 1440 · principal</span>
</div>
</button>
<button type="button" aria-pressed="false" style="padding: 10px; border-radius: 14px; border: 2px solid #23262A; background: #1A1C20; color: #EDEEF0; display: flex; flex-direction: column; gap: 10px; text-align: left">
<div aria-hidden="true" style="height: 110px; border-radius: 8px; background: #0B0C0E; padding: 10px; box-sizing: border-box; display: flex; gap: 6px; width: 100%">
<div style="width: 30%; border-radius: 6px; background: #23262A"></div>
<div style="flex-grow: 1; border-radius: 6px; background: #2A2E33"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700">Tela 2</span>
<span style="font-size: 12px; color: #A0A6AD">1920 × 1080</span>
</div>
</button>
<button type="button" aria-pressed="false" style="padding: 10px; border-radius: 14px; border: 2px dashed #2A2E33; background: transparent; color: #A0A6AD; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 160px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18"></path></svg>
<span style="font-weight: 600">Escolher uma janela</span>
</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span style="font-weight: 700">Qualidade</span>
<span style="font-size: 13px; color: #A0A6AD; font-family: 'JetBrains Mono', ui-monospace, monospace">{{presetDetail}}</span>
</div>
<div role="radiogroup" aria-label="Qualidade da transmissão" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0F1012">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{p.checked}}" onClick="{{p.pick}}" style="min-height: 44px; border-radius: 9px; border: none; background: {{p.bg}}; color: {{p.color}}; font-weight: 600">{{p.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: #1A1C20">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #A0A6AD">
<span>Uso do seu upload</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace">{{bitrate}} de ~250 Mbps</span>
</div>
<div aria-hidden="true" style="height: 6px; border-radius: 3px; background: #2A2E33; overflow: hidden">
<div style="height: 6px; width: {{barWidth}}; background: {{accent}}; border-radius: 3px"></div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Transmitir o áudio do sistema</span><span style="font-size: 12px; color: #A0A6AD">Pedro ouve o som do jogo ou do vídeo</span></span>
<input type="checkbox" checked style="width: 20px; height: 20px; accent-color: {{accent}}">
</label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Continuar transmitindo no modo jogo</span><span style="font-size: 12px; color: #A0A6AD">Usa o encoder da placa, não o processador</span></span>
<input type="checkbox" style="width: 20px; height: 20px; accent-color: {{accent}}">
</label>
</div>

<div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A0A6AD">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; padding: 3px 8px; border-radius: 6px; background: #1E3B33; color: #8FE8BB">NVENC · AV1</span>
Codificação na placa de vídeo
</span>
<div style="display: flex; gap: 10px">
<a href="Main.dc.html" style="min-height: 44px; padding: 0 18px; border-radius: 12px; background: #1F2226; color: #EDEEF0; font-weight: 600; display: flex; align-items: center">Cancelar</a>
<a href="Main.dc.html" style="min-height: 44px; padding: 0 20px; border-radius: 12px; background: {{accent}}; color: #06281A; font-weight: 700; display: flex; align-items: center">Começar a transmitir</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DD68C","options":["#3DD68C","#4CC9F0","#F2A93B","#B79CFF"]},"$preview":{"width":760,"height":680}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { preset: 'padrao' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#3DD68C';
    const all = [
      { id: 'leve', label: 'Leve', detail: '720p · 30 fps', mbps: 3 },
      { id: 'padrao', label: 'Padrão', detail: '1080p · 60 fps', mbps: 8 },
      { id: 'alta', label: 'Alta', detail: '1440p · 60 fps', mbps: 14 },
      { id: 'maxima', label: 'Máxima', detail: 'Nativa · 60 fps', mbps: 20 }
    ];
    const cur = all.find((p) => p.id === this.state.preset) || all[1];
    return {
      accent,
      presets: all.map((p) => ({
        label: p.label,
        checked: String(p.id === cur.id),
        bg: p.id === cur.id ? '#2A2E33' : 'transparent',
        color: p.id === cur.id ? '#EDEEF0' : '#A0A6AD',
        pick: () => this.setState({ preset: p.id })
      })),
      presetDetail: cur.detail + ' · ' + cur.mbps + ' Mbps',
      bitrate: cur.mbps + ' Mbps',
      barWidth: Math.max(2, Math.round((cur.mbps / 250) * 100)) + '%'
    };
  }
}
</script>
</body>
</html>
