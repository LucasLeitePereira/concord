<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Concord — compartilhar tela</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="share-title" aria-describedby="share-desc" style="width: 760px; box-sizing: border-box; background: #17191C; color: #EDEEF0; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; border-radius: 20px; border: 1px solid #2A2E33; padding: 28px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 id="share-title" style="margin: 0; font-size: 20px; font-weight: 700">Compartilhar tela</h1>
<span id="share-desc" style="font-size: 13px; color: #A0A6AD">Pedro e Ana vão ver o que você escolher.</span>
</div>
<a href="Main.dc.html" aria-label="Fechar" title="Fechar (Esc)" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #1F2226; color: #A0A6AD; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div role="tablist" aria-label="O que transmitir" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0F1012; align-self: flex-start; min-width: 260px">
<button type="button" role="tab" id="tab-telas" aria-selected="{{tabTelas.selected}}" aria-controls="painel-fontes" onClick="{{tabTelas.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 9px; border: none; background: {{tabTelas.bg}}; color: {{tabTelas.color}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Telas</button>
<button type="button" role="tab" id="tab-janelas" aria-selected="{{tabJanelas.selected}}" aria-controls="painel-fontes" onClick="{{tabJanelas.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 9px; border: none; background: {{tabJanelas.bg}}; color: {{tabJanelas.color}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Janelas</button>
</div>
<div id="painel-fontes" role="tabpanel" aria-labelledby="{{tabId}}">
<div role="radiogroup" aria-label="{{groupLabel}}" style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="padding: 8px; border-radius: 14px; border: 2px solid {{s.border}}; background: {{s.bg}}; color: #EDEEF0; display: flex; flex-direction: column; gap: 10px; text-align: left; font-family: inherit; font-size: 14px; cursor: pointer; min-width: 0">
<div aria-hidden="true" style="height: {{thumbH}}; width: 100%; box-sizing: border-box; border-radius: 8px; background: #0B0C0E; padding: 8px; display: flex; flex-direction: column; gap: 6px">
<div style="height: 6px; width: 40%; border-radius: 3px; background: #2A2E33"></div>
<div style="flex-grow: 1; display: flex; gap: 6px">
<div style="width: {{s.side}}; border-radius: 5px; background: #1F2226"></div>
<div style="flex-grow: 1; border-radius: 5px; background: {{s.tint}}"></div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0 2px 2px">
<sc-if value="{{s.isWindow}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; background: {{s.appBg}}; color: {{s.appFg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{s.initial}}</span>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
<span style="font-size: 12px; color: #A0A6AD; font-family: 'JetBrains Mono', ui-monospace, monospace">{{s.meta}}</span>
</div>
</div>
</button>
</sc-for>
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<span id="lbl-res" style="font-weight: 700">Resolução</span>
<div role="radiogroup" aria-labelledby="lbl-res" aria-describedby="res-nota" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0F1012">
<sc-for list="{{resOpts}}" as="r" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{r.checked}}" disabled="{{r.disabled}}" onClick="{{r.pick}}" style="min-height: 44px; border-radius: 9px; border: none; background: {{r.bg}}; color: {{r.color}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: {{r.cursor}}">{{r.label}}</button>
</sc-for>
</div>
<sc-if value="{{hasResNote}}" hint-placeholder-val="{{ false }}">
<span id="res-nota" style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A0A6AD">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5h.01"></path></svg>
{{resNote}}
</span>
</sc-if>
</div>
<div style="flex: 0 1 180px; display: flex; flex-direction: column; gap: 8px">
<span id="lbl-fps" style="font-weight: 700">Quadros por segundo</span>
<div role="radiogroup" aria-labelledby="lbl-fps" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0F1012">
<sc-for list="{{fpsOpts}}" as="o" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{o.checked}}" disabled="{{o.disabled}}" onClick="{{o.pick}}" style="min-height: 44px; border-radius: 9px; border: none; background: {{o.bg}}; color: {{o.color}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: {{o.cursor}}">{{o.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #1A1C20">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px">{{detail}}</span>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; color: #A0A6AD">
<span>Uso do seu upload</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace">{{uploadText}}</span>
</div>
<div role="img" aria-label="{{uploadAria}}" style="height: 8px; border-radius: 4px; background: #2A2E33; overflow: hidden">
<div style="height: 8px; width: {{barWidth}}; background: {{accent}}; border-radius: 4px"></div>
</div>
</div>

<div style="display: flex; flex-direction: column">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 6px 0; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Transmitir o áudio do PC</span><span style="font-size: 12px; line-height: 1.5; color: #A0A6AD">Quem assiste ouve o som do jogo ou do vídeo. Sua voz e a dos amigos não entram.</span></span>
<input type="checkbox" defaultChecked="{{ true }}" style="width: 20px; height: 20px; flex-shrink: 0; margin: 0; accent-color: {{accent}}; cursor: pointer">
</label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; padding: 6px 0; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Continuar transmitindo no modo jogo</span><span style="font-size: 12px; line-height: 1.5; color: #A0A6AD">{{keepDesc}}</span></span>
<input type="checkbox" style="width: 20px; height: 20px; flex-shrink: 0; margin: 0; accent-color: {{accent}}; cursor: pointer">
</label>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 1px solid #23262A">
<sc-if value="{{hasEncoder}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A0A6AD">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #1E3B33; color: #8FE8BB">{{encoderChip}}</span>
Codificação na placa de vídeo
</span>
</sc-if>
<sc-if value="{{noEncoder}}" hint-placeholder-val="{{ false }}">
<span role="note" style="display: flex; align-items: center; gap: 8px; max-width: 340px; font-size: 13px; font-weight: 600; line-height: 1.4; color: #F5C27A">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
Sem codificação na placa de vídeo: limite de 720p a 30 fps
</span>
</sc-if>
<div style="display: flex; gap: 10px; margin-left: auto">
<a href="Main.dc.html" style="min-height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 12px; background: #1F2226; color: #EDEEF0; font-weight: 600; text-decoration: none; display: flex; align-items: center">Cancelar</a>
<a href="Main-transmitindo.dc.html" style="min-height: 44px; padding: 0 20px; box-sizing: border-box; border-radius: 12px; background: {{accent}}; color: #06281A; font-weight: 700; text-decoration: none; display: flex; align-items: center">Começar a transmitir</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"aba":{"editor":"enum","options":["telas","janelas"],"default":"telas"},"encoder":{"editor":"enum","options":["nvenc","amf","qsv","nenhum"],"default":"nvenc"},"accent":{"editor":"color","default":"#3DD68C","options":["#3DD68C","#4CC9F0","#B79CFF"]},"$preview":{"width":760,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { aba: null, src: null, res: 1080, fps: 60 };
  }
  componentDidUpdate(prev) {
    if (prev.aba !== this.props.aba || prev.encoder !== this.props.encoder) this.setState({ aba: null, src: null, res: 1080, fps: 60 });
  }
  renderVals() {
    const accent = this.props.accent ?? '#3DD68C';
    const aba = this.state.aba ?? this.props.aba ?? 'telas';
    const enc = this.props.encoder ?? 'nvenc';
    const noEnc = enc === 'nenhum';
    const telas = [
      { id: 't1', name: 'Tela 1', w: 2560, h: 1440, extra: ' · principal', tint: '#1E3B33', side: '0px', isWindow: false },
      { id: 't2', name: 'Tela 2', w: 1920, h: 1080, extra: '', tint: '#2A2E33', side: '28%', isWindow: false }
    ];
    const janelas = [
      { id: 'j1', name: 'Player de vídeo — filme.mkv', initial: 'P', w: 1600, h: 900, appBg: '#213547', appFg: '#9CCBF0', tint: '#213547', side: '0px' },
      { id: 'j2', name: 'Navegador — Notícias', initial: 'N', w: 1920, h: 1040, appBg: '#352C4A', appFg: '#CDBEF5', tint: '#2A2E33', side: '22%' },
      { id: 'j3', name: 'Jogo', initial: 'J', w: 2560, h: 1440, appBg: '#1E3B33', appFg: '#8FE8BB', tint: '#1E3B33', side: '0px' },
      { id: 'j4', name: 'Bloco de notas — ideias.txt', initial: 'B', w: 1100, h: 700, appBg: '#2A2E33', appFg: '#C9CDD2', tint: '#23262A', side: '0px' },
      { id: 'j5', name: 'Explorador de Arquivos', initial: 'E', w: 1280, h: 760, appBg: '#3D2433', appFg: '#F2B8D2', tint: '#23262A', side: '30%' },
      { id: 'j6', name: 'Planilha — gastos.xlsx', initial: 'P', w: 1700, h: 980, appBg: '#1F3A3D', appFg: '#9FE0E6', tint: '#1F3A3D', side: '0px' }
    ].map((j) => Object.assign({}, j, { extra: '', isWindow: true }));
    const list = aba === 'janelas' ? janelas : telas;
    const srcId = this.state.src ?? list[0].id;
    const src = list.find((s) => s.id === srcId) || list[0];
    const dims = { 480: [854, 480], 720: [1280, 720], 1080: [1920, 1080], 1440: [2560, 1440] };
    const rates = { 480: [1.5, 2.5], 720: [3, 5], 1080: [6, 8], 1440: [10, 14] };
    const tooBig = (r) => dims[r][1] > src.h || dims[r][0] > src.w;
    const allowed = (r) => !tooBig(r) && !(noEnc && r > 720);
    const order = [480, 720, 1080, 1440];
    let res = this.state.res;
    if (!allowed(res)) res = order.filter(allowed).pop() || 480;
    const fps = noEnc ? 30 : this.state.fps;
    const mbps = rates[res][fps === 60 ? 1 : 0];
    const fmt = (v) => String(v).replace('.', ',');
    const seg = (on, disabled) => ({
      checked: String(on),
      bg: on ? '#2A2E33' : 'transparent',
      color: disabled ? '#858C94' : (on ? '#EDEEF0' : '#A0A6AD'),
      cursor: disabled ? 'not-allowed' : 'pointer'
    });
    const resOpts = order.map((r) => Object.assign({ label: r + 'p', disabled: !allowed(r), pick: () => this.setState({ res: r }) }, seg(r === res, !allowed(r))));
    const fpsOpts = [30, 60].map((f) => {
      const dis = noEnc && f === 60;
      return Object.assign({ label: String(f), disabled: dis, pick: () => this.setState({ fps: f }) }, seg(f === fps, dis));
    });
    const anyTooBig = order.some(tooBig);
    const notes = [];
    if (anyTooBig) notes.push(src.isWindow ? 'A janela tem ' + src.w + ' × ' + src.h : 'Sua tela é ' + src.w + ' × ' + src.h);
    if (noEnc) notes.push('acima de 720p a 30 fps precisa da placa de vídeo');
    const resNote = notes.join(' · ');
    const tab = (id) => ({
      selected: String(aba === id),
      bg: aba === id ? '#2A2E33' : 'transparent',
      color: aba === id ? '#EDEEF0' : '#A0A6AD',
      pick: () => this.setState({ aba: id, src: null })
    });
    const pct = (mbps / 250) * 100;
    const chips = { nvenc: 'NVENC · AV1', amf: 'AMF · HEVC', qsv: 'QuickSync · H.264' };
    return {
      accent,
      tabTelas: tab('telas'),
      tabJanelas: tab('janelas'),
      tabId: aba === 'janelas' ? 'tab-janelas' : 'tab-telas',
      groupLabel: aba === 'janelas' ? 'Janela para transmitir' : 'Tela para transmitir',
      cols: aba === 'janelas' ? 3 : 2,
      thumbH: aba === 'janelas' ? '76px' : '112px',
      sources: list.map((s) => ({
        name: s.name,
        initial: s.initial || '',
        appBg: s.appBg || '',
        appFg: s.appFg || '',
        isWindow: !!s.isWindow,
        tint: s.tint,
        side: s.side,
        meta: s.w + ' × ' + s.h + s.extra,
        checked: String(s.id === src.id),
        border: s.id === src.id ? accent : '#23262A',
        bg: s.id === src.id ? '#16241E' : '#1A1C20',
        pick: () => this.setState({ src: s.id })
      })),
      resOpts,
      fpsOpts,
      hasResNote: notes.length > 0,
      resNote: resNote.charAt(0).toUpperCase() + resNote.slice(1),
      detail: res + 'p · ' + fps + ' fps · ' + fmt(mbps) + ' Mbps',
      uploadText: fmt(mbps) + ' de ~250 Mbps',
      uploadAria: 'Uso do upload: ' + fmt(Math.round(pct * 10) / 10) + '%',
      barWidth: Math.max(1, pct).toFixed(1) + '%',
      keepDesc: noEnc ? 'Sem a placa de vídeo, a codificação usa o processador e pode pesar no jogo.' : 'A codificação fica na placa de vídeo, longe do processador do jogo.',
      hasEncoder: !noEnc,
      noEncoder: noEnc,
      encoderChip: chips[enc] || chips.nvenc
    };
  }
}
</script>
</body>
</html>
