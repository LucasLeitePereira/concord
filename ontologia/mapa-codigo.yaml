# conceito (id) -> onde vive no código (caminhos relativos à raiz do repo)
mapa:
  metricas-tooling:
    codigo: [metricas/coletar.py, metricas/ab/aplicar_ocultos.py]
    testes: [metricas/test_coletar.py]
  control-message:
    codigo: ["sala/crates/protocol/src/lib.rs (ControlMessage, encode_frame, FrameDecoder)"]
    testes: [sala/crates/protocol/tests/acceptance_protocol.rs]
  media-datagram:
    codigo: ["sala/crates/protocol/src/lib.rs (MediaDatagram, max_audio_payload, max_video_payload)"]
    testes: [sala/crates/protocol/tests/acceptance_protocol.rs]
  capabilities:
    codigo: ["sala/crates/protocol/src/lib.rs (Capabilities, VideoCodec)"]
  ipc-message:
    codigo: ["sala/crates/protocol/src/lib.rs (UiToCore, CoreToUi, encode_ipc_line, decode_ipc_line)", "sala/crates/core/src/ipc.rs (IpcServer, IpcClient, pipe_name, IpcError::AlreadyRunning)"]
    testes: [sala/crates/protocol/tests/acceptance_protocol.rs, sala/crates/core/tests/ipc.rs]
  chat-message:
    codigo: ["sala/crates/protocol/src/lib.rs (ControlMessage::Chat, ChatEntry)"]
  jitter-buffer:
    codigo: ["sala/crates/core/src/jitter.rs (JitterBuffer, Pop, JitterStats, peek_next p/ FEC)"]
    testes: [sala/crates/core/tests/acceptance_jitter.rs, "sala/crates/core/src/jitter.rs (mod tests)"]
  voice-frame:
    codigo: ["sala/crates/core/src/voice.rs (VoiceEncoder, VoiceDecoder, EncodedFrame, VoiceEngine)", "sala/crates/core/src/audio_device.rs (AudioInput, AudioOutput, Sink, list_devices)"]
    testes: ["sala/crates/core/src/voice.rs (mod tests)"]
  voice-activation:
    codigo: ["sala/crates/core/src/voice.rs (Activation; input_gain/apply_input_gain e LevelMeter/MicLevels, D-014)", "sala/crates/core/src/config.rs (AudioConfig.vad_threshold, input_volume)"]
    testes: ["sala/crates/core/src/voice.rs (mod tests)"]
  call:
    codigo: ["sala/crates/core/src/voice.rs (VoiceEngine: peers, volume, loopback)", "sala/crates/core/src/session.rs (sessão de voz por amigo em Connected/Disconnected)"]
  identity-fingerprint:
    codigo: ["sala/crates/core/src/identity.rs (Fingerprint, LocalIdentity)"]
    testes: [sala/crates/core/tests/acceptance_identity.rs]
  peer-connection:
    codigo: ["sala/crates/core/src/net.rs (Net, NetEvent, NetError, trust_store_from_config)", "sala/crates/core/src/identity.rs (TrustStore::check_peer, PeerDecision, keep_connection)"]
    testes: [sala/crates/core/tests/net.rs, sala/crates/core/tests/acceptance_identity.rs]
  friend:
    codigo: ["sala/crates/core/src/config.rs (Friend)", "sala/crates/core/src/identity.rs (FriendEntry)"]
    testes: ["sala/crates/core/src/config.rs (mod tests)"]
  config:
    codigo: ["sala/crates/core/src/config.rs (Config, AudioConfig, HotkeyConfig, GameModeConfig, ShareConfig, SoundConfig, ConfigError)"]
    testes: ["sala/crates/core/src/config.rs (mod tests)"]
  profile:
    codigo: ["sala/crates/core/src/config.rs (Profile)", "sala/crates/core/src/cli.rs (CliArgs)"]
    testes: ["sala/crates/core/src/config.rs (mod tests)", "sala/crates/core/src/cli.rs (mod tests)"]
  core-process:
    codigo: ["sala/crates/core/src/session.rs (Session: laço net→voz/chat, Hello/Status, grava pin TOFU; controle set_muted/set_deafened/set_ptt/set_game_mode, StatusFlags, SessionEvent)", "sala/crates/core/src/app.rs (orquestrador D-012: Controller, UiHost, PlatformApi, run, notify_running_instance)", "sala/crates/core/src/main.rs (fino: args, perfil, init_logging com rotação diária, app::run, 2ª instância → OpenUi)"]
    testes: [sala/crates/core/tests/f1_integration.rs, sala/crates/core/tests/f2_game_mode.rs]
  chat-history:
    codigo: ["sala/crates/core/src/session.rs (State::history, send_chat, chat_history)"]
    testes: [sala/crates/core/tests/f1_integration.rs]
  game-detector:
    codigo: ["sala/crates/core/src/game_detector.rs (GameRules, Hysteresis, GameDetector, ForegroundSample, Origin)", "sala/crates/core/src/platform/foreground.rs (probe: janela em 1º plano via Win32)"]
    testes: [sala/crates/core/tests/acceptance_game_detector.rs, "sala/crates/core/src/game_detector.rs (mod tests)", "sala/crates/core/examples/fake_game.rs (jogo falso em tela cheia; teste ignorado probe_sees_fake_game)"]
  game-mode:
    testes: [sala/crates/core/tests/f2_game_mode.rs]
    codigo: ["sala/crates/core/src/app.rs (Controller: sequência entrar/sair D-012, Trigger/Step::Cause = origem da transição, notificação de chat, tique do detector)", "sala/crates/core/src/game_detector.rs (Transition, override manual D-008)", "sala/crates/core/src/platform/mod.rs (HotkeyAction::ToggleGameMode, MenuItem::ToggleGameMode, TrayState)"]
  platform-win32:
    codigo: ["sala/crates/core/src/platform/mod.rs (Platform, PlatformEvent, TrayState, HotkeyAction, MenuItem)", "sala/crates/core/src/platform/window.rs (thread, janela oculta, bandeja, menu, notificação, sondagem PTT/mouse)", "sala/crates/core/src/platform/hotkey.rs (Hotkey, parser)", sala/crates/core/src/platform/icon.rs]
    testes: ["sala/crates/core/src/platform/*.rs (mod tests)"]
  ui-process:
    codigo: ["sala/crates/core/src/ui_process.rs (UiProcess, resolve_ui_exe, ShutdownOutcome)", "sala/crates/core/examples/fake_ui.rs (UI falsa para testes)"]
    testes: [sala/crates/core/tests/ipc.rs]
  medicao-desempenho:
    codigo: ["sala/scripts/measure.ps1 (RAM/CPU dos processos sala-*; -Seconds -Interval -ProcessId -Json)", "sala/scripts/measure-game-mode.ps1 (roteiro: release, perfis a/b sintéticos, EnterGameMode pelo pipe, mede o núcleo a, try/finally)"]
  ui-settings:
    codigo: ["sala/crates/core/src/settings.rs (Config <-> AudioSettings/GameModeSettings/HotkeySettings/FriendInfo, validação do UpdateConfig)", "sala/crates/core/src/voice.rs (voice_allowed: sala D-015)"]
    testes: [sala/crates/core/tests/f3_settings.rs]
