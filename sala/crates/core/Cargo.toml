[package]
name = "sala-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sala_core"
path = "src/lib.rs"

[[bin]]
name = "sala-core"
path = "src/main.rs"

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
sala-protocol = { path = "../protocol" }
