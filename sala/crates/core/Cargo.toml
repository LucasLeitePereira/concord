[package]
name = "sala-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sala_core"
path = "src/lib.rs"

[[bin]]
name = "concord"
path = "src/main.rs"

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
sala-protocol = { path = "../protocol", features = ["ipc-client"] }
sala-video = { path = "../video" }
sha2 = "0.11.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tracing-subscriber.workspace = true
opus = "0.4"
cpal = "0.18"
tracing-appender = "0.2"
nnnoiseless = { version = "0.5.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# Already in the lock (windows-capture); only used for WASAPI process loopback (loopback.rs).
windows-core = "=0.62.2" # the `#[implement]` macro names this crate directly
windows = { version = "=0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
